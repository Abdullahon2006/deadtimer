name: myatlas
options:
  bundleIdPrefix: com.myatlas
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution.git
    from: 6.0.0
targets:
  myatlas:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: myatlas
      - path: Sources/MyAtlasCore
    resources:
      - path: myatlas/Resources
    dependencies:
      - package: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myatlas.app
        SWIFT_VERSION: 5.9
        INFOPLIST_FILE: myatlas/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
  myatlasTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: myatlasTests
      - path: Sources/MyAtlasCore
    dependencies:
      - target: myatlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myatlas.tests
        SWIFT_VERSION: 5.9
  myatlasUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: myatlasUITests
    dependencies:
      - target: myatlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myatlas.uitests
        SWIFT_VERSION: 5.9